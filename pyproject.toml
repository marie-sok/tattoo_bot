[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inna-tattoo-bot"
version = "0.1.0"
description = "Telegram booking and AI concierge bot for Inna Strakhova"
requires-python = ">=3.11,<3.14"

[project.scripts]
inna_tattoo_bot = "render_run:cli"

[tool.setuptools]
py-modules = ["render_run"]

[tool.setuptools.packages.find]
include = ["app*"]
